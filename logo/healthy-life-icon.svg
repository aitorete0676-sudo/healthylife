    <path d="M0 -150 L0 150" stroke="#0f3d24" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>
    <path d="M0 -40 L48 -86 M0 30 L56 -20 M0 -40 L-48 -86 M0 30 L-56 -20" stroke="#0f3d24" stroke-opacity=".4" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
