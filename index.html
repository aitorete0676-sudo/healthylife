<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Healthy Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon-32.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Healthy Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a personal training log used several times a day
   IDEA an athlete's daily ledger: fuel in, energy out, body numbers, with a coach beside it
   PICTURE a large calorie ring (eaten vs target) with the remaining kcal in its centre, macros as three bars
   COLOUR white ground, near-black ink, tomato leads (energy), cobalt for protein, amber carbs, violet fat
   TYPE Archivo 800 for figures and titles, Archivo for text
   LAYOUT laptop: day log left, coach chat sticky right; phone: Hoy first (ring, macros, body), tabs at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1114);--panel:light-dark(#f4f4f2,#1a1d21);--line:light-dark(#e2e2de,#2b2f35);--ink:light-dark(#121316,#f1f1ee);--mute:light-dark(#5f6168,#a2a5ab);--hot:light-dark(#ff4a2b,#ff6448);--hotsoft:light-dark(#ffe3dc,#3a1d17);--p:light-dark(#2846ff,#6f84ff);--c:light-dark(#e09600,#ffbf3c);--f:light-dark(#8a4bff,#ad86ff);--water:light-dark(#0a8fd6,#3fb4f0);--ok:light-dark(#108a4a,#3ccf7e)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em}
.wrap{padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;max-width:1320px;margin:0 auto}
.brand{font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--hot);display:inline-block}
.mode{font-size:13px;color:var(--mute)}
.datenav{margin-left:auto;display:flex;align-items:center;gap:4px}
.datenav b{min-width:9.5em;text-align:center;font-weight:700}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:40px;height:40px;padding:0 10px}
.ib:hover{background:var(--panel)}
.ib:disabled{opacity:.35;cursor:default}
.toptabs{display:none;gap:4px}
.toptabs button,.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mute)}
.toptabs button[aria-current=true]{background:var(--ink);color:var(--bg)}
.app{max-width:1320px;margin:0 auto;padding-block:20px 110px}
.view{display:none}
body[data-view=hoy] #v-hoy,body[data-view=chat] #v-chat,body[data-view=prog] #v-prog,body[data-view=perfil] #v-perfil,body[data-view=lib] #v-lib{display:block}
body[data-view=chat] #v-chat{display:flex}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:6px 4px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current=true]{color:var(--hot)}
.card{background:var(--panel);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}
.hero{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.ringbox{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:22px;padding:22px 18px}
.ring{width:min(78vw,300px);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-weight:800;font-size:clamp(44px,12vw,64px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring .mid span{font-size:15px;opacity:.75}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;text-align:center}
.kpis div{font-size:13px;opacity:.75}
.kpis b{display:block;font-size:22px;font-weight:800;opacity:1;color:var(--bg);white-space:nowrap}
.macro{display:grid;grid-template-columns:6.5em minmax(0,1fr) auto;align-items:center;gap:10px;padding-block:7px}
.macro .t{height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.macro .t i{display:block;height:100%;border-radius:6px}
.macro small{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.macro small b{color:var(--ink)}
.body4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:12px;border:1px solid var(--line)}
.stat label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.stat input{width:100%;border:0;background:none;font-size:22px;font-weight:800;padding:0;outline:none;font-variant-numeric:tabular-nums}
.stat input::placeholder{color:var(--line)}
.stat .u{font-size:13px;color:var(--mute)}
.water{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.water .t{grid-column:1/-1;height:10px;border-radius:5px;background:color-mix(in srgb,var(--water) 15%,transparent);overflow:hidden}
.water .t i{display:block;height:100%;background:var(--water)}
.water .btns{display:flex;gap:6px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.secthead h2{font-size:24px;font-weight:800}
.secthead span{color:var(--mute);font-size:14px;white-space:nowrap}
.meal{border-top:1px solid var(--line);padding-block:10px}
.meal h3{font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.meal h3 span{color:var(--mute);font-weight:500;white-space:nowrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;align-items:center;padding:6px 0}
.row .n{overflow-wrap:anywhere}
.row .n small{display:block;color:var(--mute);font-size:13px}
.row .k{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--mute);width:32px;height:32px;border-radius:8px;font-size:18px}
.x:hover{background:var(--hotsoft);color:var(--hot)}
.empty{color:var(--mute);font-size:15px;padding:6px 0}
details.add{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.add summary{cursor:pointer;font-weight:600;padding:10px 0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:12px}
.form .full,.form .half{grid-column:1/-1}
.form label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;color:var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.hot{background:var(--hot);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.hint{font-size:14px;color:var(--mute);margin-top:10px}
.stepk{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.woest{margin:0;font-size:15px;color:var(--mute)}.woest b{color:var(--ink)}
.hint button{border:0;background:none;color:var(--hot);font-weight:700;padding:0}
.notice{background:var(--hotsoft);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:14px}
.notice button{border:0;background:none;color:var(--hot);font-weight:700;padding:0}
/* chat */
#v-chat{flex-direction:column;gap:10px;height:calc(100svh - 190px)}
.chathead h2{font-size:24px;font-weight:800}
.chathead p{margin:2px 0 0;color:var(--mute);font-size:14px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.m ul{margin:4px 0 6px;padding-left:18px}
.m.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;white-space:pre-wrap}
.m.a{align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px}
.m.err{background:var(--hotsoft)}
.acts{margin-top:8px;display:grid;gap:4px}
.acts div{font-size:13px;background:var(--bg);border-left:3px solid var(--ok);padding:4px 8px;border-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;text-align:left}
.chips button:hover{border-color:var(--hot)}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.composer#composer{grid-template-columns:auto minmax(0,1fr) auto}
.camb{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);background:var(--bg)}
.photo{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px;color:var(--mute)}.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photo button{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer}
.m.u img{display:block;width:140px;max-width:100%;border-radius:10px;margin-bottom:6px}
.cal .calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal .calnav b{font-size:18px}.cal .calnav b::first-letter,.phtitle h3::first-letter{text-transform:uppercase}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calgrid em{font-style:normal;text-align:center;font-size:12px;color:var(--mute);padding-bottom:2px}
.cd{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0;overflow:hidden;cursor:pointer;font:inherit}
.cd:disabled{opacity:.35;cursor:default}.cd i{position:absolute;left:5px;top:3px;font-style:normal;font-size:13px;font-weight:700}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cd.has i{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.cd.today{border-color:var(--hot)}.cd.sel{outline:3px solid var(--hot);outline-offset:-1px}
.phday,.cmp{margin-top:12px}.phtitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}.phtitle h3{font-size:18px;font-weight:800}.phtitle span,.phtitle label{color:var(--mute);font-size:14px}
.phtitle select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg);color:var(--ink)}
.phgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.empty,.ph.missing{display:grid;place-items:center;color:var(--mute);font-size:13px}.ph .x{position:absolute;right:6px;top:6px;width:auto;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;min-width:30px;height:30px}.ph .x.sure{background:var(--hot);padding:0 8px}
.phadd{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:12px;display:grid;place-content:center;text-align:center;color:var(--mute);font-size:13px;cursor:pointer}.phadd span{font-size:30px;line-height:1;color:var(--ink)}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.phhead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}.phhead span{color:var(--mute)}
.shsearch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.scan{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:14px}
.scanv{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:42svh}.scanv video{width:100%;height:100%;object-fit:cover;display:block}
.scanv i{position:absolute;left:12%;right:12%;top:45%;height:2px;background:var(--hot);box-shadow:0 0 8px var(--hot)}
.scanrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.scanrow input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:var(--bg);color:var(--ink)}
.dhead{margin-top:24px;border-block:1px solid var(--line);padding:10px 0}
.dtop{display:flex;justify-content:space-between;align-items:center}.dtop h2{font-size:clamp(24px,4vw,30px);font-weight:800}
.dsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.3fr);gap:6px;margin-top:10px;text-align:right}
.dsum div{display:grid}.dsum small{color:var(--mute);font-size:13px}.dsum b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.dsum .kc b{font-size:24px;font-weight:800}
.mcards{display:grid;gap:10px;margin-top:12px}
.mcard{background:var(--panel);border-radius:16px;overflow:hidden}
.mhead{display:grid;grid-template-columns:34px minmax(0,1fr) auto 40px;align-items:center;gap:10px;padding:14px 12px 14px 14px}
.mico svg{width:30px;height:30px;display:block}
.mname{border:0;background:none;padding:0;text-align:left;font:inherit;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer}
.mk{display:grid;text-align:right;line-height:1.1}.mk b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.mk small{color:var(--mute);font-size:13px}
.mplus{border:0;background:none;color:var(--hot);font-size:34px;font-weight:500;line-height:1;width:40px;height:40px;cursor:pointer}
.msum{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:10px 12px 10px 58px;cursor:pointer}
.msum em{font-style:normal;color:var(--mute);text-align:center}
.mrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:right;font-variant-numeric:tabular-nums;font-size:16px;gap:6px}
.mrow.sm{font-size:14px;color:var(--mute);margin-right:40px;margin-top:4px}
.mitem{border-top:1px solid var(--line);padding:10px 12px 10px 58px}
.mi1{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;align-items:center;gap:8px}.mi1 span{display:block;font-size:16px}.mi1 small{color:var(--ok);font-size:14px}.mi1 b{font-size:17px;font-variant-numeric:tabular-nums}
.mact{display:flex;border-top:1px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.mact button{flex:1;border:0;border-right:1px solid var(--line);background:none;color:var(--hot);font:inherit;font-size:15px;font-weight:600;padding:12px 4px;cursor:pointer;white-space:nowrap}.mact button:last-child{border-right:0}
.mform{display:flex;gap:8px;align-items:end;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}.mform label{display:grid;gap:4px;font-size:13px;color:var(--mute);flex:1;min-width:150px}
.mform input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;background:var(--bg);color:var(--ink)}
@media(max-width:420px){.dsum b{font-size:15px}.mrow{font-size:14px}.msum,.mitem{padding-left:14px}}
.pmeal{font-size:14px;color:var(--mute);display:flex;gap:6px;align-items:center}.pmeal select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg);color:var(--ink)}
.plist{display:grid;gap:10px;margin-top:12px}
.plato{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--panel);border-radius:16px;padding:14px}
.pinfo b{display:block;font-size:17px}.pinfo small{color:var(--mute);font-size:13px}
.padd{padding:10px 14px}.pmore{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-bottom:-6px}
.pb{margin-top:12px}.pbres{display:grid;gap:4px}.pbres:empty{display:none}
.pbpick{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;cursor:pointer}.pbpick small{color:var(--mute);white-space:nowrap}
.pbing{display:grid;grid-template-columns:minmax(0,1fr) auto 3.2em 32px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
.pbing label{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--mute)}.pbing input{width:70px;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:16px;background:var(--bg);color:var(--ink)}.pbing b{text-align:right;font-variant-numeric:tabular-nums}
.pbtot{margin:4px 0 0;color:var(--mute)}.pbtot b{color:var(--ink);font-size:18px}
.memd{margin-top:28px}
.composer textarea{border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px;resize:none;min-height:48px;max-height:140px;background:var(--bg)}
.welcome{color:var(--mute);font-size:15px}
.welcome b{color:var(--ink)}
/* progress */
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px}
.kpirow div{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--mute)}
.kpirow b{display:block;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.fig{position:relative;height:280px;background:var(--panel);border-radius:18px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig .none{position:absolute;inset:0;display:grid;place-content:center;color:var(--mute);text-align:center;padding:20px}
svg text{font:13px Archivo,system-ui,sans-serif;fill:var(--mute)}
.krow{display:grid;grid-template-columns:4.2em minmax(0,1fr) 4.2em;gap:10px;align-items:center;padding:3px 0;font-size:14px}
.krow .t{position:relative;height:16px}
.krow .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.krow .t i.over{background:var(--hot)}
.krow .t em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--hot)}
.bal h2{font-size:22px;font-weight:800;margin-bottom:8px}
.bal .eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal .eq div{display:grid;font-size:13px;color:var(--mute)}.bal .eq b{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.bal .eq i{font-style:normal;font-size:22px;color:var(--mute)}
.bal .eq .neg b,.brow b.neg{color:var(--ok)}.bal .eq .pos b,.brow b.pos{color:var(--hot)}
.brow .t em{left:50%;background:var(--line)!important}.brow .t i{left:auto}.brow .t i.neg{background:var(--ok)}.brow .t i.pos{background:var(--hot)}
.krow b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.krow span{color:var(--mute);white-space:nowrap}
.wlist .row{grid-template-columns:5em minmax(0,1fr) auto}
/* profile */
.calc{display:grid;gap:4px;font-size:15px;margin-top:14px}
.calc div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}
.calc b{white-space:nowrap}
.check{display:flex!important;flex-direction:row!important;gap:8px!important;align-items:flex-start;color:var(--ink)!important;font-size:15px!important}
.check input{width:20px;height:20px;margin-top:2px}

<script>
{
const $=s=>document.querySelector(s);
/* sin zoom: pellizco (iOS) y doble toque */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&!e.target.closest('input,textarea,select'))e.preventDefault();lastTouch=n},{passive:false});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const r0=n=>Math.round(Number(n)||0);
const r1=n=>Math.round((Number(n)||0)*10)/10;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmt=n=>r0(n).toLocaleString('es-ES');
const uid=()=>Math.random().toString(36).slice(2,9);
const MEALS=[['desayuno','Desayuno'],['comida','Comida'],['merienda','Merienda'],['cena','Cena'],['snack','Picoteo']];
const mealName=k=>(MEALS.find(m=>m[0]===k)||MEALS[4])[1];
const mealNow=()=>{const h=new Date().getHours();return h<11?'desayuno':h<16?'comida':h<19?'merienda':'cena'};
const dayLabel=s=>{if(s===today())return 'Hoy';if(s===addDays(today(),-1))return 'Ayer';return parse(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})};
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))&&String(s)<=today()?String(s):today();

const S={profile:null,days:{},chat:{turns:[]},lib:{items:[]},mem:{notes:[]},date:today(),mode:'cargando'};
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
/* por 100 g, aprox. BEDCA/USDA: nombre, kcal, P, C, G, ración típica (g), ración */
const BASE=[['Pechuga de pollo a la plancha',165,31,0,3.6,150,'1 filete'],['Pechuga de pollo cruda',110,23,0,1.5,150,'1 filete'],['Huevo',143,12.6,0.7,9.5,60,'1 huevo'],['Clara de huevo',52,11,0.7,0.2,33,'1 clara'],['Arroz blanco cocido',130,2.7,28,0.3,200,'1 plato'],['Arroz blanco crudo',350,7,78,0.6,80,'1 ración'],['Pasta cocida',158,5.8,31,0.9,200,'1 plato'],['Pasta cruda',360,12.5,72,1.5,80,'1 ración'],['Pan blanco de barra',260,8.5,51,1.5,60,'1/4 de barra'],['Pan integral',245,9,43,3.5,60,'2 rebanadas'],['Patata cocida',86,1.9,20,0.1,200,'1 patata grande'],['Patatas fritas caseras',290,3.4,36,15,150,'1 ración'],['Lentejas cocidas',116,9,20,0.4,250,'1 plato'],['Garbanzos cocidos',164,8.9,27,2.6,250,'1 plato'],['Copos de avena',375,13,60,7,50,'1 ración'],['Leche entera',63,3.1,4.7,3.6,250,'1 vaso'],['Leche semidesnatada',46,3.2,4.8,1.6,250,'1 vaso'],['Yogur natural',61,3.5,4.7,3.3,125,'1 yogur'],['Yogur griego natural',130,5.5,4,10,125,'1 yogur'],['Skyr o yogur proteico',60,10,4,0.2,150,'1 envase'],['Queso fresco de Burgos',174,12,4,12,80,'1 porción'],['Queso curado',400,26,0.5,33,30,'3 lonchas'],['Jamón serrano',240,30,0,13,30,'3 lonchas'],['Pechuga de pavo fiambre',100,18,2,2,40,'4 lonchas'],['Atún en lata al natural',110,25,0,1,52,'1 lata'],['Atún en aceite escurrido',190,26,0,9.5,52,'1 lata'],['Salmón',200,20,0,13,150,'1 filete'],['Merluza',75,16,0,1,150,'1 filete'],['Ternera magra',130,21,0,5,150,'1 filete'],['Carne picada mixta',250,17,0,20,125,'1 ración'],['Lomo de cerdo',150,21,0,7,150,'1 ración'],['Aceite de oliva',900,0,0,100,10,'1 cucharada'],['Crema de cacahuete',600,25,15,50,15,'1 cucharada'],['Almendras',590,21,9,52,25,'1 puñado'],['Nueces',650,15,7,65,25,'1 puñado'],['Plátano',95,1.2,21,0.3,120,'1 plátano'],['Manzana',52,0.3,12,0.2,180,'1 manzana'],['Naranja',45,0.9,9,0.2,180,'1 naranja'],['Fresas',32,0.7,6,0.3,150,'1 bol'],['Aguacate',160,2,2,15,100,'medio aguacate'],['Tomate',20,0.9,3.5,0.2,150,'1 tomate'],['Ensalada verde',15,1.3,2,0.2,100,'1 bol'],['Brócoli',34,2.8,4,0.4,150,'1 ración'],['Proteína whey',380,78,6,5,30,'1 cacito'],['Chocolate negro 70 %',580,8,35,42,20,'2 onzas'],['Galletas tipo María',440,7,75,12,30,'4 galletas'],['Cerveza',43,0.5,3.5,0,330,'1 lata'],['Refresco de cola',42,0,10.6,0,330,'1 lata'],['Pizza',270,11,32,10,300,'media pizza'],['Tortilla de patatas',180,6,12,12,150,'1 pincho grande'],['Hamburguesa completa',250,13,25,11,220,'1 hamburguesa'],['Croissant',410,8,45,21,60,'1 croissant'],['Café con leche',30,1.6,2.4,1.6,200,'1 taza'],['Azúcar',400,0,100,0,8,'1 sobre']];
const BASEI=BASE.map((b,i)=>({id:'b'+i,name:b[0],kcal:b[1],p:b[2],c:b[3],f:b[4],unit:'g',base:100,def:b[5],label:b[6],builtin:true}));
let col=null,sample=null,busy=false,ctl=null,deferHoy=false;
const LS='healthy-life-v1';

const blankDay=date=>({date,foods:[],workouts:[],water:0,sleep:null,steps:null,weight:null,waist:null});
const day=date=>S.days[date]||blankDay(date);
function editDay(date){const d=S.days[date]?structuredClone(S.days[date]):blankDay(date);S.days[date]=d;return d}

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,days:S.days,chat:S.chat,lib:S.lib,mem:S.mem}))}catch(e){}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v){S.profile=v.profile||null;S.days=v.days||{};S.chat=v.chat||{turns:[]};S.lib=v.lib||{items:[]};S.mem=v.mem||{notes:[]}}}catch(e){}}
const chains={};
function save(key,data){
  if(!col){saveLocal();return}
  const body=JSON.parse(JSON.stringify(data));
  chains[key]=(chains[key]||Promise.resolve()).then(()=>col.doc(key).set(body)).catch(e=>toast('No se pudo guardar ('+(e&&e.code||'error')+')'));
}
const saveDay=date=>save('day_'+date,S.days[date]);

const stepKcal=(n,date)=>n>0?r0(n*0.0005*(curWeight(date)||75)):0;
function totals(date){
  const d=day(date);const t={kcal:0,p:0,c:0,f:0,burn:0,min:0};
  d.foods.forEach(x=>{t.kcal+=+x.kcal||0;t.p+=+x.p||0;t.c+=+x.c||0;t.f+=+x.f||0});
  d.workouts.forEach(w=>{t.burn+=+w.kcal||0;t.min+=+w.min||0});
  // Pasos: ≈0,0005 kcal por paso y kg de peso.
  t.stepsK=stepKcal(d.steps,date);t.burn+=t.stepsK;
  return t;
}
function curWeight(before){
  const ks=Object.keys(S.days).filter(k=>S.days[k].weight&&(!before||k<=before)).sort();
  return ks.length?+S.days[ks[ks.length-1]].weight:(S.profile&&+S.profile.weight)||null;
}
function targets(){
  const p=S.profile||{};const w=curWeight()||75;
  const ok=!!(p.sex&&p.age&&p.height&&(curWeight()));
  const bmr=ok?10*w+6.25*p.height-5*p.age+(p.sex==='h'?5:-161):null;
  const tdee=bmr?bmr*(+p.activity||1.375):null;
  const adj={perder:-500,suave:-300,mantener:0,ganar:250}[p.goal||'mantener']||0;
  const floor=p.sex==='m'?1200:1500;
  let kcal=num(p.kcalOverride)||(tdee?Math.max(floor,Math.round((tdee+adj)/10)*10):2000);
  const pr=Math.round((num(p.protPerKg)||2)*w);const f=Math.round(.8*w);
  const c=Math.max(0,Math.round((kcal-pr*4-f*9)/4));

// Balance: comido − (TMB + digestión 10 % + ejercicio + pasos). 7.700 kcal ≈ 1 kg de grasa.
function balance(date){const p=S.profile||{},w=curWeight(date)||curWeight();

  const t=totals(date),bmr=r0(10*w+6.25*p.height-5*p.age+(p.sex==='h'?5:-161)),dig=r0(bmr*0.1),ex=r0(t.burn-t.stepsK),st=r0(t.stepsK);
  const out=bmr+dig+ex+st;return{eat:r0(t.kcal),out,bmr,dig,ex,st,bal:r0(t.kcal-out),logged:day(date).foods.length>0}}

function metFor(sp,lvl,min,km,rest){const s=SPORTS[sp]||SPORTS.otro;

/* Ajusta la cantidad de cada ingrediente (entre x0,5 y x1,8) para acercar la receta a los macros pedidos */
function fitMacros(ing,tg){
  const keys=['kcal','p','c','f'].filter(k=>tg[k]);if(!ing.length||!keys.length)return ing;
  const sc=ing.map(()=>1);
  const err=()=>keys.reduce((e,k)=>{const v=ing.reduce((s,a,i)=>s+a[k]*sc[i],0);return e+((v-tg[k])/tg[k])**2*(k==='kcal'?2:1)},0)+sc.reduce((e,x)=>e+0.02*(x-1)**2,0);
  for(let it=0;it<60;it++){let moved=false;
    for(let i=0;i<sc.length;i++){for(const d of[0.1,-0.1,0.03,-0.03]){const o=sc[i],n=Math.min(1.8,Math.max(0.5,o+d));if(n===o)continue;const e0=err();sc[i]=n;if(err()<e0-1e-9)moved=true;else sc[i]=o}}
    if(!moved)break}
  return ing.map((a,i)=>{const g=a.g>0?Math.max(5,Math.round(a.g*sc[i]/5)*5):0;const k=a.g>0?g/a.g:sc[i];return{...a,g:g||a.g,kcal:r0(a.kcal*k),p:r1(a.p*k),c:r1(a.c*k),f:r1(a.f*k)}});
}

function paintWeight(box){
  const W=box.clientWidth,H=box.clientHeight;if(!W)return;
  const ws=Object.keys(S.days).filter(k=>S.days[k].weight).sort().map(k=>({t:parse(k).getTime(),w:+S.days[k].weight,k}));
  if(ws.length<2){box.innerHTML=`<div class="none">Apunta tu peso en «Hoy» (en ayunas, mismo día de la semana).<br>Con 2 registros aparece la gráfica.</div>`;return}
  const gw=num(S.profile&&S.profile.goalWeight);
  const vals=ws.map(x=>x.w).concat(gw&&Math.abs(gw-ws[ws.length-1].w)<15?[gw]:[]);
  let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const L=44,Rm=70,Tp=18,B=30;
  const x=t=>L+(t-ws[0].t)/(ws[ws.length-1].t-ws[0].t||1)*(W-L-Rm);
  const y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  let g='';for(let v=Math.ceil(lo);v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-Rm+10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  if(vals.includes(gw))g+=`<line x1="${L}" x2="${W-Rm+10}" y1="${y(gw)}" y2="${y(gw)}" stroke="var(--ok)" stroke-dasharray="5 5" stroke-width="2"/><text x="${W-Rm+14}" y="${y(gw)+4}" style="fill:var(--ok)">obj. ${r1(gw)}</text>`;
  const pts=ws.map(p=>`${x(p.t).toFixed(1)},${y(p.w).toFixed(1)}`).join(' ');
  const lp=ws[ws.length-1];
  const fd=k=>parse(k).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><path d="M${x(ws[0].t)},${H-B} L${pts.replace(/ /g,' L')} L${x(lp.t)},${H-B}Z" fill="var(--hot)" opacity=".12"/>${g}
  <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="3" stroke-linejoin="round"/>
  ${ws.length<40?ws.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.w)}" r="3.5" fill="var(--hot)"/>`).join(''):''}
  <text x="${x(lp.t)+10}" y="${y(lp.w)+5}" style="fill:var(--ink);font-weight:800;font-size:15px">${r1(lp.w)} kg</text>
  <text x="${L}" y="${H-8}">${fd(ws[0].k)}</text><text x="${W-Rm}" y="${H-8}" text-anchor="end">${fd(lp.k)}</text></svg>`;
}

/* asistente gratis en la web: Gemini (plan gratuito) a través de /api/ai */
function geminiSample(){
  const call=async(body,signal)=>{
    let r;try{r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json','x-app-password':getPass()},body:JSON.stringify(body),signal})}
    catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'api_error'}}
    const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:j.code||'api_error',message:j.error||''};return j};
  async function run(input,opts,json){
    opts=opts||{};
    const contents=(typeof input==='string'?[{role:'user',content:input}]:input).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content)}]}));
    if(opts.images&&opts.images.length){const last=contents[contents.length-1];
      for(const b of opts.images){const d=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=bad;r.readAsDataURL(b)});
        last.parts.push({inlineData:{mimeType:b.type||'image/jpeg',data:d.slice(d.indexOf(',')+1)}})}}
    const tl=opts.tools||[];
    const tools=tl.map(t=>({name:t.name,description:t.description,...(t.inputSchema?{parameters:upType(t.inputSchema)}:{})}));
    for(let round=0;round<8;round++){
      if(opts.signal&&opts.signal.aborted)throw{code:'cancelled'};
      const j=await call({contents,tools,json},opts.signal);
      const parts=(j.content&&Array.isArray(j.content.parts))?j.content.parts:[];
      const calls=parts.filter(x=>x.functionCall);
      const text=parts.filter(x=>x.text&&!x.thought).map(x=>x.text).join('');
      if(!calls.length){if(j.finishReason==='SAFETY'&&!text)throw{code:'refused'};opts.onText&&opts.onText({text,delta:text});return{text,truncated:j.finishReason==='MAX_TOKENS'}}
      contents.push({role:'model',parts});
      const resp=[];
      for(const x of calls){const name=x.functionCall.name,t=tl.find(y=>y.name===name);let out;
        try{if(!t)throw new Error('Herramienta desconocida');out=await t.execute(x.functionCall.args||{},{signal:opts.signal})}catch(e){out='Error: '+(e&&e.message||e)}
        resp.push({functionResponse:{name,response:{result:out}}})}
      contents.push({role:'user',parts:resp});
    }
    throw{code:'api_error'};
  }
  const retry=async(fn,n)=>{for(let k=0;;k++){try{return await fn()}catch(e){const c=e&&e.code;if(k>=n||c==='cancelled'||c==='no_key'||c==='bad_password'||c==='rate_limited')throw e;await new Promise(r=>setTimeout(r,800*(k+1)))}}};
  const f=(i,o)=>retry(()=>run(i,o,false),1);
  f.json=(i,o)=>retry(async()=>{const{text}=await run(i,o,true);const t=text.replace(/```(?:json)?/g,'');const m=t.match(/\{[\s\S]*\}/);try{return JSON.parse(m?m[0]:t)}catch(e){throw{code:'bad_json'}}},2);
  return f;
}

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='apppass'){try{localStorage.setItem(PASSKEY,el.value.trim())}catch(e){}toast('Contraseña guardada');return}
  if(el.dataset.body){const d=editDay(S.date);const n=num(el.value);d[el.dataset.body]=n==null?null:(el.dataset.body==='steps'?r0(n):r1(n));saveDay(S.date);renderProg();if(el.dataset.body==='weight')renderPerfil();if(el.dataset.body==='steps'){const o=$('#b-steps-k');if(o)o.textContent=d.steps?'≈ '+fmt(stepKcal(d.steps,S.date))+' kcal':''}}
  if(el.closest('#f-prof')){const fd=new FormData($('#f-prof'));const p={...(S.profile||{})};
    for(const k of['sex','activity','goal','notes'])p[k]=String(fd.get(k)||'').slice(0,300);
    for(const k of['age','height','weight','goalWeight','protPerKg','kcalOverride'])p[k]=num(fd.get(k));
    p.addExercise=fd.get('addExercise')==='on';S.profile=p;save('profile',p);renderHoy();
    const a=document.activeElement;a&&a.blur&&a.matches('select,[type=checkbox]')&&a.blur();renderPerfil()}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(deferHoy&&!$('#v-hoy').contains(document.activeElement)){deferHoy=false;renderHoy()}},0));
document.addEventListener('submit',e=>{const mf=e.target.closest&&e.target.closest('[data-mcopy],[data-msave]');
  if(mf){e.preventDefault();const k=mf.dataset.mcopy||mf.dataset.msave,items=day(S.date).foods.filter(x=>(x.meal||'snack')===k),fd=new FormData(mf);
    if(mf.dataset.mcopy){const to=String(fd.get('to')||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(to))return;const d2=editDay(to);d2.foods.push(...items.map(x=>({...x,id:uid()})));saveDay(to);
      toast(`Copiado: ${items.length} ${items.length===1?'alimento':'alimentos'} a ${parse(to).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}`)}
    else{const name=String(fd.get('name')||'').trim().slice(0,80);if(!name)return;const sm=kk=>items.reduce((a,x)=>a+(+x[kk]||0),0);
      upsertLib([{kind:'plato',serv:1,ings:items.map(x=>{const q=String(x.qty||''),g=parseFloat(q.replace(',','.'));const isg=/\d\s*g$/.test(q)&&g>0;return{name:x.name,amt:isg?g:1,unit:isg?'g':'ración',kcal:r0(x.kcal),p:r1(x.p),c:r1(x.c),f:r1(x.f),src:isg?{base:g,kcal:x.kcal,p:x.p,c:x.c,f:x.f}:{base:1,kcal:x.kcal,p:x.p,c:x.c,f:x.f}}}),name,unit:'ración',base:1,def:1,label:'1 ración',kcal:r0(sm('kcal')),p:r1(sm('p')),c:r1(sm('c')),f:r1(sm('f'))}]);toast('Guardado en Mis platos: '+name)}
    MACT=null;document.activeElement&&document.activeElement.blur();deferHoy=false;renderHoy();renderProg();return}
  e.preventDefault();const f=e.target;
  if(f.id==='composer'){if(busy){ctl&&ctl.abort();return}const q=$('#q');const v=q.value;q.value='';q.style.height='';send(v);return}
  if(f.id==='f-new'){const fd=new FormData(f);const it={name:String(fd.get('name')).trim().slice(0,80),unit:'ud',base:1,def:1,label:String(fd.get('label')||'').trim().slice(0,40)||'1 ración',kcal:r0(fd.get('kcal')),p:r1(fd.get('p')),c:r1(fd.get('c')),f:r1(fd.get('f'))};
    if(!it.name)return;upsertLib([it]);const saved=(S.lib.items||[]).find(x=>norm(x.name)===norm(it.name));
    if(fd.get('now')==='on'&&saved)addFromItem({...saved,mine:true},1,true);else{toast('Guardado en Mis alimentos');renderSheet()}
    f.reset();$('#shnew').open=false;return}
  if(f.id==='f-rec'){document.activeElement&&document.activeElement.blur();makeRecipe(f);return}
  if(f.id==='f-plato'){pbSave(f);return}
  if(f.id==='f-mem'){const t=String(new FormData(f).get('t')||'').trim();if(t){document.activeElement&&document.activeElement.blur();addMem(t)}return}
  const fd=new FormData(f);const d=editDay(S.date);
  if(f.id==='f-food')d.foods.push({id:uid(),meal:fd.get('meal'),name:String(fd.get('name')).slice(0,80),qty:String(fd.get('qty')||'').slice(0,40),kcal:r0(fd.get('kcal')),p:r1(fd.get('p')),c:r1(fd.get('c')),f:r1(fd.get('f'))});
  if(f.id==='f-wo'){const sp=sportKey(fd.get('sport')),lvl=+fd.get('lvl')||0,min=r0(fd.get('min')),s=SPORTS[sp],km=s.km?num(fd.get('km'))||0:0,rest=s.rest?+fd.get('rest'):null;WO.sport=sp;WO.lvl=lvl;WO.min=min;if(rest!=null)WO.rest=rest;
    const det=[String(fd.get('detail')||'').trim(),km?km+' km':'',['suave','normal','intensa'][lvl],rest!=null?'descansos '+RESTN[rest]:''].filter(Boolean).join(' · ');
    d.workouts.push({id:uid(),type:s.type,sport:sp,name:s.label,min,kcal:num(fd.get('kcal'))>0?r0(fd.get('kcal')):woKcal(sp,lvl,min,km,rest),detail:det.slice(0,300)})}
  saveDay(S.date);document.activeElement&&document.activeElement.blur();deferHoy=false;renderHoy();renderProg();
});
$('#camin').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';pickPhoto(f)});
document.addEventListener('click',e=>{const pb=e.target.closest&&e.target.closest('[data-pbnew],[data-pbclose],[data-pbpick],[data-pbdel],[data-pbedit],[data-addplato],[data-liball]');
  if(pb){const d=pb.dataset;
    if(d.pbnew){Object.assign(PB,{open:true,id:null,name:'',serv:1,ings:[]});renderLib();setTimeout(()=>$('#f-plato input[name=name]')?.focus(),0)}
    if(d.pbclose){PB.open=false;renderLib()}
    if(d.pbedit){const it=libItems().find(x=>x.id===d.pbedit);if(it){Object.assign(PB,{open:true,id:it.id,name:it.name,serv:it.serv||1,ings:(it.ings||[]).map(x=>({...x}))});renderLib();scrollTo({top:0,behavior:'smooth'})}}
    if(d.pbpick){const it=findItem(d.pbpick);if(it){const amt=it.unit==='g'?(it.def||100):1;PB.ings.push({name:it.name,unit:it.unit==='g'?'g':'ración',amt,src:{base:it.base||1,kcal:it.kcal,p:it.p,c:it.c,f:it.f},...calc(it,amt)});
      const f=$('#f-plato');if(f){PB.name=f.name.value;PB.serv=f.serv.value}$('#pbq').value='';$('#pbres').innerHTML='';$('#pbings').innerHTML=pbIngsHtml();$('#pbtot').innerHTML=pbTotHtml()}}
    if(d.pbdel){PB.ings.splice(+d.pbdel,1);$('#pbings').innerHTML=pbIngsHtml();$('#pbtot').innerHTML=pbTotHtml()}
    if(d.addplato)addPlato(d.addplato);
    if(d.liball){LIBALL=d.liball==='1';renderLib()}
    return}
  const mb=e.target.closest&&e.target.closest('[data-mtog],[data-diahide],[data-mact],[data-mcam]');
  if(mb){if(mb.dataset.mtog){MOPEN[mb.dataset.mtog]=!MOPEN[mb.dataset.mtog];MACT=null}
    if(mb.dataset.diahide)DIAHIDE=!DIAHIDE;
    if(mb.dataset.mact)MACT=MACT===mb.dataset.mact?null:mb.dataset.mact;
    if(mb.dataset.mcam){go('chat');const q=$('#q');if(q&&!q.value)q.value='Esto es mi '+MNAME[mb.dataset.mcam].split(' ')[0].toLowerCase()+'. ';$('#camin').click();return}
    renderHoy();return}
  if(e.target.closest&&e.target.closest('[data-unphoto]')){PHOTO=null;renderPhoto()}
  const b=e.target.closest&&e.target.closest('[data-phday],[data-phmon],[data-phdel]');if(!b)return;
  if(b.dataset.phday){PH.sel=b.dataset.phday;renderProg()}
  if(b.dataset.phmon){PH.m+=+b.dataset.phmon;if(PH.m<0){PH.m=11;PH.y--}if(PH.m>11){PH.m=0;PH.y++}renderProg()}
  if(b.dataset.phdel){if(b.dataset.sure){delPhoto(PH.sel,b.dataset.phdel)}else{b.dataset.sure='1';b.textContent='¿Borrar?';b.classList.add('sure');setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='×';b.classList.remove('sure')}},3000)}}});
document.addEventListener('change',e=>{if(e.target.id==='pmeal'){PMEAL=e.target.value;return}if(e.target.id==='phin'){const f=[...(e.target.files||[])];e.target.value='';addPhotos(PH.sel,f)}if(e.target.id==='phcmp'){PH.cmp=e.target.value;renderProg()}});
$('#q').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>=700){e.preventDefault();$('#composer').requestSubmit()}});
addEventListener('resize',()=>{if(innerWidth>=1000&&document.body.dataset.view==='chat')go('hoy')});

async function boot(){
  go('hoy');render();
  if(!window.claude){WEB=true;S.mode='local';loadLocal();sample=geminiSample();render();return}
  let db=null,user=null;
  try{[db,user,sample,ASSETS]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample'),claude.use('assets')])}catch(e){}
  const id=user?await user.id():null;
  if(!db||!id){S.mode='local';loadLocal();render();return}
  col=db.collection('data/users/'+id);
  const timer=setTimeout(()=>{if(S.mode==='cargando'){S.mode='local';loadLocal();col=null;render();toast('No conecto con tu cuenta: guardo en este navegador.')}},10000);
  col.onSnapshot(snap=>{
    clearTimeout(timer);if(S.mode==='local'&&!col)return;
    S.mode='nube';const days={};let prof=null,chat=null,lib=null,mem=null;
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='profile')prof=v;else if(d.id==='chat')chat=v;else if(d.id==='library')lib=v;else if(d.id==='memory')mem=v;else if(d.id.startsWith('day_'))days[d.id.slice(4)]=v});
    S.days=days;S.profile=prof;S.lib=lib||{items:[]};S.mem=mem||{notes:[]};if(!busy)S.chat=chat?structuredClone(chat):{turns:[]};
    render();
  },e=>{toast('Error de datos ('+(e&&e.code||'')+')')});
}
boot();
}
