<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Healthy Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon-32.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Healthy Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a personal training log used several times a day
   IDEA an athlete's daily ledger: fuel in, energy out, body numbers, with a coach beside it
   PICTURE a large calorie ring (eaten vs target) with the remaining kcal in its centre, macros as three bars
   COLOUR white ground, near-black ink, tomato leads (energy), cobalt for protein, amber carbs, violet fat
   TYPE Archivo 800 for figures and titles, Archivo for text
   LAYOUT laptop: day log left, coach chat sticky right; phone: Hoy first (ring, macros, body), tabs at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1114);--panel:light-dark(#f4f4f2,#1a1d21);--line:light-dark(#e2e2de,#2b2f35);--ink:light-dark(#121316,#f1f1ee);--mute:light-dark(#5f6168,#a2a5ab);--hot:light-dark(#ff4a2b,#ff6448);--hotsoft:light-dark(#ffe3dc,#3a1d17);--p:light-dark(#2846ff,#6f84ff);--c:light-dark(#e09600,#ffbf3c);--f:light-dark(#8a4bff,#ad86ff);--water:light-dark(#0a8fd6,#3fb4f0);--ok:light-dark(#108a4a,#3ccf7e)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em}
.wrap{padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;max-width:1320px;margin:0 auto}
.brand{font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--hot);display:inline-block}
.mode{font-size:13px;color:var(--mute)}
.datenav{margin-left:auto;display:flex;align-items:center;gap:4px}
.datenav b{min-width:9.5em;text-align:center;font-weight:700}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:40px;height:40px;padding:0 10px}
.ib:hover{background:var(--panel)}
.ib:disabled{opacity:.35;cursor:default}
.toptabs{display:none;gap:4px}
.toptabs button,.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mute)}
.toptabs button[aria-current=true]{background:var(--ink);color:var(--bg)}
.app{max-width:1320px;margin:0 auto;padding-block:20px 110px}
.view{display:none}
body[data-view=hoy] #v-hoy,body[data-view=chat] #v-chat,body[data-view=prog] #v-prog,body[data-view=perfil] #v-perfil,body[data-view=lib] #v-lib{display:block}
body[data-view=chat] #v-chat{display:flex}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:6px 4px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current=true]{color:var(--hot)}
.card{background:var(--panel);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}
.hero{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.ringbox{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:22px;padding:22px 18px}
.ring{width:min(78vw,300px);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-weight:800;font-size:clamp(44px,12vw,64px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring .mid span{font-size:15px;opacity:.75}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;text-align:center}
.kpis div{font-size:13px;opacity:.75}
.kpis b{display:block;font-size:22px;font-weight:800;opacity:1;color:var(--bg);white-space:nowrap}
.macro{display:grid;grid-template-columns:6.5em minmax(0,1fr) auto;align-items:center;gap:10px;padding-block:7px}
.macro .t{height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.macro .t i{display:block;height:100%;border-radius:6px}
.macro small{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.macro small b{color:var(--ink)}
.body4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:12px;border:1px solid var(--line)}
.stat label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.stat input{width:100%;border:0;background:none;font-size:22px;font-weight:800;padding:0;outline:none;font-variant-numeric:tabular-nums}
.stat input::placeholder{color:var(--line)}
.stat .u{font-size:13px;color:var(--mute)}
.water{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.water .t{grid-column:1/-1;height:10px;border-radius:5px;background:color-mix(in srgb,var(--water) 15%,transparent);overflow:hidden}
.water .t i{display:block;height:100%;background:var(--water)}
.water .btns{display:flex;gap:6px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.secthead h2{font-size:24px;font-weight:800}
.secthead span{color:var(--mute);font-size:14px;white-space:nowrap}
.meal{border-top:1px solid var(--line);padding-block:10px}
.meal h3{font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.meal h3 span{color:var(--mute);font-weight:500;white-space:nowrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;align-items:center;padding:6px 0}
.row .n{overflow-wrap:anywhere}
.row .n small{display:block;color:var(--mute);font-size:13px}
.row .k{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--mute);width:32px;height:32px;border-radius:8px;font-size:18px}
.x:hover{background:var(--hotsoft);color:var(--hot)}
.empty{color:var(--mute);font-size:15px;padding:6px 0}
details.add{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.add summary{cursor:pointer;font-weight:600;padding:10px 0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:12px}
.form .full,.form .half{grid-column:1/-1}
.form label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;color:var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.hot{background:var(--hot);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.hint{font-size:14px;color:var(--mute);margin-top:10px}
.woest{margin:0;font-size:15px;color:var(--mute)}.woest b{color:var(--ink)}
.hint button{border:0;background:none;color:var(--hot);font-weight:700;padding:0}
.notice{background:var(--hotsoft);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:14px}
.notice button{border:0;background:none;color:var(--hot);font-weight:700;padding:0}
/* chat */
#v-chat{flex-direction:column;gap:10px;height:calc(100svh - 190px)}
.chathead h2{font-size:24px;font-weight:800}
.chathead p{margin:2px 0 0;color:var(--mute);font-size:14px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.m ul{margin:4px 0 6px;padding-left:18px}
.m.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;white-space:pre-wrap}
.m.a{align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px}
.m.err{background:var(--hotsoft)}
.acts{margin-top:8px;display:grid;gap:4px}
.acts div{font-size:13px;background:var(--bg);border-left:3px solid var(--ok);padding:4px 8px;border-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;text-align:left}
.chips button:hover{border-color:var(--hot)}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.composer textarea{border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px;resize:none;min-height:48px;max-height:140px;background:var(--bg)}
.welcome{color:var(--mute);font-size:15px}
.welcome b{color:var(--ink)}
/* progress */
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px}
.kpirow div{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--mute)}
.kpirow b{display:block;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.fig{position:relative;height:280px;background:var(--panel);border-radius:18px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig .none{position:absolute;inset:0;display:grid;place-content:center;color:var(--mute);text-align:center;padding:20px}
svg text{font:13px Archivo,system-ui,sans-serif;fill:var(--mute)}
.krow{display:grid;grid-template-columns:4.2em minmax(0,1fr) 4.2em;gap:10px;align-items:center;padding:3px 0;font-size:14px}
.krow .t{position:relative;height:16px}
.krow .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.krow .t i.over{background:var(--hot)}
.krow .t em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--hot)}
.krow b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.krow span{color:var(--mute);white-space:nowrap}
.wlist .row{grid-template-columns:5em minmax(0,1fr) auto}
/* profile */
.calc{display:grid;gap:4px;font-size:15px;margin-top:14px}
.calc div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}
.calc b{white-space:nowrap}
.check{display:flex!important;flex-direction:row!important;gap:8px!important;align-items:flex-start;color:var(--ink)!important;font-size:15px!important}
.check input{width:20px;height:20px;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
/* add-food sheet */
.noscroll{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheetin{background:var(--bg);width:100%;max-width:640px;max-height:92svh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-head h2{font-size:24px;font-weight:800}
#shmeal{margin-bottom:10px}
#shmeal button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#shq{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;background:var(--panel)}
.shres h4{margin:16px 0 2px;font-size:13px;color:var(--mute);font-weight:600}
.res{border-bottom:1px solid var(--line)}
.resb{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 2px;align-items:center}
.resb small{display:block;color:var(--mute);font-size:13px}
.resb em{font-style:normal;font-size:12px;background:var(--hotsoft);color:var(--hot);border-radius:6px;padding:1px 6px;margin-left:6px}
.resb b{white-space:nowrap}
.res.open{background:var(--panel);border-radius:12px;padding:0 10px 12px;border:0;margin:4px 0}
.qty{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qty input{width:90px;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:16px;background:var(--bg);text-align:center}
.qty output{flex-basis:100%;font-size:14px;color:var(--mute)}
.qty .btn{margin-left:auto}
.addbig{width:100%;padding:14px;font-size:17px;margin-bottom:6px}
.plus{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:30px;height:30px;margin-left:8px;font-weight:700;color:var(--hot);font-size:18px;line-height:1}
.meal h3 span{display:flex;align-items:center}
.row.lib{grid-template-columns:minmax(0,1fr) auto auto;border-top:1px solid var(--line)}
.acts2{display:flex;gap:4px;align-items:center}
.composer input{border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px;background:var(--bg)}
.sug{margin-top:14px}
.sug .rem{margin:4px 0 12px;color:var(--mute);font-size:15px}
.sug .rem b{color:var(--ink);white-space:nowrap}
.rform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.rform label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.rform input,.rform select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;background:var(--bg);color:var(--ink);width:100%}
.rform .have{grid-column:1/-1}
.rform .btn{grid-column:1/-1}
.recipe{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;display:grid;gap:10px}
.recipe h3{font-size:20px;font-weight:800}
.recipe .rd{margin:0;color:var(--mute);font-size:14px}
.fit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fit div{background:var(--panel);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mute)}
.fit b{display:block;font-size:18px;color:var(--ink);white-space:nowrap}
.fit div:first-child b{color:var(--hot)}
.rcols{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rcols h4{margin:0 0 4px;font-size:15px}
.rcols ul,.rcols ol{margin:0;padding-left:20px;font-size:15px;display:grid;gap:4px}
.rcols small{color:var(--mute);white-space:nowrap}
.rform{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.rcols{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.rform{grid-template-columns:repeat(5,minmax(0,1fr))}}
.rform label:first-child{grid-column:1/-1}
@media(min-width:700px){.rform label:first-child{grid-column:auto}}
.rlist{display:grid;gap:10px;margin-top:4px}
.recipe details summary{cursor:pointer;font-weight:600;font-size:15px;padding:4px 0}
.recipe details .rcols{margin-top:8px}
.link{border:0;background:none;color:var(--hot);font-weight:700;padding:0;font-size:inherit}
@media(max-width:420px){.fit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sug-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.sug h2{font-size:22px;font-weight:800}
.sug-h p{margin:4px 0 0;color:var(--mute);font-size:15px}
.sug-h p b{color:var(--ink);white-space:nowrap}
.sug-c{display:flex;gap:8px}
.sug-c select{border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--bg);font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:10px;margin-top:14px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.opt h3{font-size:17px;font-weight:800}
.opt p{margin:0;color:var(--mute);font-size:14px}
.om{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
.om b{color:var(--hot)}
.om span{color:var(--mute);white-space:nowrap}
.opt ul{margin:0;padding-left:18px;font-size:14px;flex:1}
.opt li small{color:var(--mute)}
.ttl{font-size:clamp(30px,5vw,44px);font-weight:800;margin-bottom:6px}
@media(min-width:700px){.sheet{align-items:center}.sheetin{border-radius:22px;max-height:85vh}}
@media(min-width:700px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.form{grid-template-columns:repeat(4,minmax(0,1fr))}.form .half{grid-column:span 2}}
@media(min-width:1000px){
.tabs{display:none}.toptabs{display:flex}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;padding-bottom:40px}
#v-chat{display:flex!important;position:sticky;top:90px;height:calc(100svh - 110px);grid-column:2;grid-row:1;border-left:1px solid var(--line);padding-left:24px}
.view:not(#v-chat){grid-column:1;grid-row:1}
.ring{width:260px}
}
@media(prefers-reduced-motion:no-preference){.ring circle.v{transition:stroke-dasharray .6s ease}.macro .t i,.water .t i{transition:width .5s ease}}
</style>

<header class="top wrap">
  <div class="bar">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 1024 1024" aria-hidden="true" style="border-radius:8px;flex:none"><rect width="1024" height="1024" fill="#16181c"/><circle cx="512" cy="512" r="300" fill="none" stroke="#2b2f36" stroke-width="110"/><path d="M512 212 A300 300 0 1 1 228.1 415.7" fill="none" stroke="#ff4a2b" stroke-width="110" stroke-linecap="round"/><g transform="translate(512 525) rotate(-28)"><path d="M0 -215 C 70 -215 95 -130 120 -40 C 160 90 100 200 0 200 C -100 200 -160 90 -120 -40 C -95 -130 -70 -215 0 -215 Z" fill="#1d7a45"/><path d="M0 -180 C 52 -180 72 -110 93 -30 C 125 80 78 168 0 168 C -78 168 -125 80 -93 -30 C -72 -110 -52 -180 0 -180 Z" fill="#c9ea7a"/><circle cx="0" cy="70" r="70" fill="#8a5426"/></g></svg>Healthy Life</div>
    <span class="mode" id="mode">Cargando…</span>
    <nav class="toptabs" id="toptabs">
      <button data-v="hoy">Hoy</button><button data-v="lib">Alimentos</button><button data-v="prog">Progreso</button><button data-v="perfil">Perfil</button>
    </nav>
    <div class="datenav">
      <button class="ib" id="prev" aria-label="Día anterior">‹</button>
      <b id="dlabel">Hoy</b>
      <button class="ib" id="next" aria-label="Día siguiente">›</button>
    </div>
  </div>
</header>

<main class="app wrap">
  <section class="view" id="v-hoy"></section>

  <section class="view" id="v-chat">
    <div class="chathead"><h2>Asistente</h2><p>Dile lo que comes o entrenas y lo apunta. Pregúntale lo que quieras.</p></div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer">
      <textarea id="q" rows="1" placeholder="Escribe qué has comido…"></textarea>
      <button class="btn hot" id="sendbtn" type="submit">Enviar</button>
    </form>
  </section>

  <section class="view" id="v-prog"></section>
  <section class="view" id="v-perfil"></section>
  <section class="view" id="v-lib"></section>
</main>

<nav class="tabs" id="tabs">

<script>
{
const $=s=>document.querySelector(s);
/* sin zoom: pellizco (iOS) y doble toque */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&!e.target.closest('input,textarea,select'))e.preventDefault();lastTouch=n},{passive:false});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const r0=n=>Math.round(Number(n)||0);
const r1=n=>Math.round((Number(n)||0)*10)/10;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmt=n=>r0(n).toLocaleString('es-ES');
const uid=()=>Math.random().toString(36).slice(2,9);
const MEALS=[['desayuno','Desayuno'],['comida','Comida'],['merienda','Merienda'],['cena','Cena'],['snack','Picoteo']];
const mealName=k=>(MEALS.find(m=>m[0]===k)||MEALS[4])[1];
const mealNow=()=>{const h=new Date().getHours();return h<11?'desayuno':h<16?'comida':h<19?'merienda':'cena'};
const dayLabel=s=>{if(s===today())return 'Hoy';if(s===addDays(today(),-1))return 'Ayer';return parse(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})};
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))&&String(s)<=today()?String(s):today();

const S={profile:null,days:{},chat:{turns:[]},lib:{items:[]},mem:{notes:[]},date:today(),mode:'cargando'};
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
/* por 100 g, aprox. BEDCA/USDA: nombre, kcal, P, C, G, ración típica (g), ración */
const BASE=[['Pechuga de pollo a la plancha',165,31,0,3.6,150,'1 filete'],['Pechuga de pollo cruda',110,23,0,1.5,150,'1 filete'],['Huevo',143,12.6,0.7,9.5,60,'1 huevo'],['Clara de huevo',52,11,0.7,0.2,33,'1 clara'],['Arroz blanco cocido',130,2.7,28,0.3,200,'1 plato'],['Arroz blanco crudo',350,7,78,0.6,80,'1 ración'],['Pasta cocida',158,5.8,31,0.9,200,'1 plato'],['Pasta cruda',360,12.5,72,1.5,80,'1 ración'],['Pan blanco de barra',260,8.5,51,1.5,60,'1/4 de barra'],['Pan integral',245,9,43,3.5,60,'2 rebanadas'],['Patata cocida',86,1.9,20,0.1,200,'1 patata grande'],['Patatas fritas caseras',290,3.4,36,15,150,'1 ración'],['Lentejas cocidas',116,9,20,0.4,250,'1 plato'],['Garbanzos cocidos',164,8.9,27,2.6,250,'1 plato'],['Copos de avena',375,13,60,7,50,'1 ración'],['Leche entera',63,3.1,4.7,3.6,250,'1 vaso'],['Leche semidesnatada',46,3.2,4.8,1.6,250,'1 vaso'],['Yogur natural',61,3.5,4.7,3.3,125,'1 yogur'],['Yogur griego natural',130,5.5,4,10,125,'1 yogur'],['Skyr o yogur proteico',60,10,4,0.2,150,'1 envase'],['Queso fresco de Burgos',174,12,4,12,80,'1 porción'],['Queso curado',400,26,0.5,33,30,'3 lonchas'],['Jamón serrano',240,30,0,13,30,'3 lonchas'],['Pechuga de pavo fiambre',100,18,2,2,40,'4 lonchas'],['Atún en lata al natural',110,25,0,1,52,'1 lata'],['Atún en aceite escurrido',190,26,0,9.5,52,'1 lata'],['Salmón',200,20,0,13,150,'1 filete'],['Merluza',75,16,0,1,150,'1 filete'],['Ternera magra',130,21,0,5,150,'1 filete'],['Carne picada mixta',250,17,0,20,125,'1 ración'],['Lomo de cerdo',150,21,0,7,150,'1 ración'],['Aceite de oliva',900,0,0,100,10,'1 cucharada'],['Crema de cacahuete',600,25,15,50,15,'1 cucharada'],['Almendras',590,21,9,52,25,'1 puñado'],['Nueces',650,15,7,65,25,'1 puñado'],['Plátano',95,1.2,21,0.3,120,'1 plátano'],['Manzana',52,0.3,12,0.2,180,'1 manzana'],['Naranja',45,0.9,9,0.2,180,'1 naranja'],['Fresas',32,0.7,6,0.3,150,'1 bol'],['Aguacate',160,2,2,15,100,'medio aguacate'],['Tomate',20,0.9,3.5,0.2,150,'1 tomate'],['Ensalada verde',15,1.3,2,0.2,100,'1 bol'],['Brócoli',34,2.8,4,0.4,150,'1 ración'],['Proteína whey',380,78,6,5,30,'1 cacito'],['Chocolate negro 70 %',580,8,35,42,20,'2 onzas'],['Galletas tipo María',440,7,75,12,30,'4 galletas'],['Cerveza',43,0.5,3.5,0,330,'1 lata'],['Refresco de cola',42,0,10.6,0,330,'1 lata'],['Pizza',270,11,32,10,300,'media pizza'],['Tortilla de patatas',180,6,12,12,150,'1 pincho grande'],['Hamburguesa completa',250,13,25,11,220,'1 hamburguesa'],['Croissant',410,8,45,21,60,'1 croissant'],['Café con leche',30,1.6,2.4,1.6,200,'1 taza'],['Azúcar',400,0,100,0,8,'1 sobre']];
const BASEI=BASE.map((b,i)=>({id:'b'+i,name:b[0],kcal:b[1],p:b[2],c:b[3],f:b[4],unit:'g',base:100,def:b[5],label:b[6],builtin:true}));
let col=null,sample=null,busy=false,ctl=null,deferHoy=false;
const LS='healthy-life-v1';

const blankDay=date=>({date,foods:[],workouts:[],water:0,sleep:null,steps:null,weight:null,waist:null});
const day=date=>S.days[date]||blankDay(date);
function editDay(date){const d=S.days[date]?structuredClone(S.days[date]):blankDay(date);S.days[date]=d;return d}

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,days:S.days,chat:S.chat,lib:S.lib,mem:S.mem}))}catch(e){}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v){S.profile=v.profile||null;S.days=v.days||{};S.chat=v.chat||{turns:[]};S.lib=v.lib||{items:[]};S.mem=v.mem||{notes:[]}}}catch(e){}}
const chains={};
function save(key,data){
  if(!col){saveLocal();return}
  const body=JSON.parse(JSON.stringify(data));
  chains[key]=(chains[key]||Promise.resolve()).then(()=>col.doc(key).set(body)).catch(e=>toast('No se pudo guardar ('+(e&&e.code||'error')+')'));
}
const saveDay=date=>save('day_'+date,S.days[date]);

function totals(date){
  const d=day(date);const t={kcal:0,p:0,c:0,f:0,burn:0,min:0};
  d.foods.forEach(x=>{t.kcal+=+x.kcal||0;t.p+=+x.p||0;t.c+=+x.c||0;t.f+=+x.f||0});
  d.workouts.forEach(w=>{t.burn+=+w.kcal||0;t.min+=+w.min||0});
  return t;
}
function curWeight(before){
  const ks=Object.keys(S.days).filter(k=>S.days[k].weight&&(!before||k<=before)).sort();
  return ks.length?+S.days[ks[ks.length-1]].weight:(S.profile&&+S.profile.weight)||null;
}
function targets(){
  const p=S.profile||{};const w=curWeight()||75;
  const ok=!!(p.sex&&p.age&&p.height&&(curWeight()));
  const bmr=ok?10*w+6.25*p.height-5*p.age+(p.sex==='h'?5:-161):null;
  const tdee=bmr?bmr*(+p.activity||1.375):null;
  const adj={perder:-500,suave:-300,mantener:0,ganar:250}[p.goal||'mantener']||0;
  const floor=p.sex==='m'?1200:1500;
  let kcal=num(p.kcalOverride)||(tdee?Math.max(floor,Math.round((tdee+adj)/10)*10):2000);
  const pr=Math.round((num(p.protPerKg)||2)*w);const f=Math.round(.8*w);
  const c=Math.max(0,Math.round((kcal-pr*4-f*9)/4));
  return{kcal,p:pr,c,f,water:Math.round(w*35/250)*250,bmr,tdee,adj,ok,w,floor};
}

/* ---------- HOY ---------- */
function renderHoy(){
  const host=$('#v-hoy');
  if(host.contains(document.activeElement)&&document.activeElement.matches('input,select')){deferHoy=true;return}
  const d=day(S.date),t=totals(S.date),T=targets(),p=S.profile||{};
  const goal=T.kcal+(p.addExercise?t.burn:0);
  const left=goal-t.kcal,frac=Math.min(1,t.kcal/goal),R=44,C=2*Math.PI*R;
  const over=left<0;
  const mac=[['Proteína','p',t.p,T.p],['Carbohidratos','c',t.c,T.c],['Grasa','f',t.f,T.f]];
  const foodsBy=MEALS.map(([k,n])=>{const it=d.foods.filter(x=>(x.meal||'snack')===k);return{k,n,it,kc:it.reduce((a,x)=>a+(+x.kcal||0),0)}});
  const sec=foodsBy.filter(m=>m.it.length);
  host.innerHTML=`
  ${!T.ok?`<div class="notice">Objetivo provisional de 2.000 kcal. <button data-go="perfil">Completa tu perfil</button> para calcular el tuyo.</div>`:''}
  <div class="hero">
    <div class="ringbox">
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(127,127,127,.28)" stroke-width="9"/>
        ${frac>0?`<circle class="v" cx="50" cy="50" r="${R}" fill="none" stroke="var(--hot)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(frac*C).toFixed(1)} ${C.toFixed(1)}"/>`:''}</svg>
        <div class="mid"><div class="big">${fmt(Math.abs(left))}</div><span>${over?'kcal por encima':'kcal restantes'}</span></div>
      </div>
      <div class="kpis"><div><b>${fmt(goal)}</b>Objetivo</div><div><b>${fmt(t.kcal)}</b>Comido</div><div><b>${fmt(t.burn)}</b>Ejercicio</div></div>
    </div>
    <div class="card">
      <h2 style="font-size:22px;font-weight:800;margin-bottom:6px">Macros</h2>
      ${mac.map(([n,k,v,g])=>`<div class="macro"><span>${n}</span><div class="t"><i style="width:${Math.min(100,g?v/g*100:0).toFixed(1)}%;background:var(--${k})"></i></div><small><b>${r0(v)}</b> / ${g} g</small></div>`).join('')}
      <div class="body4">
        <div class="stat water"><div><label>Agua</label><b style="font-size:22px;font-weight:800">${fmt(d.water||0)}</b> <span class="u">/ ${fmt(T.water)} ml</span></div>
          <div class="btns"><button class="ib" data-water="-250" aria-label="Quitar 250 ml">−</button><button class="ib" data-water="250">+250</button></div>
          <div class="t"><i style="width:${Math.min(100,(d.water||0)/T.water*100).toFixed(1)}%"></i></div></div>
        ${[['weight','Peso','kg','0.1'],['waist','Cintura','cm','0.5'],['sleep','Sueño','h','0.5'],['steps','Pasos','','100']].map(([k,n,u,st])=>`<div class="stat"><label for="b-${k}">${n}${u?' ('+u+')':''}</label><input id="b-${k}" data-body="${k}" type="number" inputmode="decimal" step="${st}" min="0" value="${d[k]??''}" placeholder="—"></div>`).join('')}
      </div>
    </div>
  </div>

  ${recipeCard()}
  <div class="secthead"><h2>Comidas</h2><span>${fmt(t.kcal)} kcal</span></div>
  <button class="btn hot addbig" data-sheet="${mealNow()}">+ Añadir alimento</button>
  ${foodsBy.filter(m=>m.it.length||m.k!=='snack').map(m=>`<div class="meal"><h3>${m.n}<span>${m.kc?fmt(m.kc)+' kcal':''}<button class="plus" data-sheet="${m.k}" aria-label="Añadir a ${m.n}">+</button></span></h3>
    ${m.it.map(x=>`<div class="row"><div class="n">${esc(x.name)}<small>${x.qty?esc(x.qty)+' · ':''}P ${r0(x.p)} · C ${r0(x.c)} · G ${r0(x.f)}</small></div><div class="k">${fmt(x.kcal)}</div><button class="x" data-del-food="${esc(x.id)}" aria-label="Borrar ${esc(x.name)}">×</button></div>`).join('')}</div>`).join('')}
  <p class="hint">O <button data-go="chat">díselo al asistente</button>: «he comido un plato de macarrones con tomate». Lo que apuntas se guarda en Mis alimentos.</p>

  <div class="secthead"><h2>Entrenamiento</h2><span>${fmt(t.min)} min · ${fmt(t.burn)} kcal</span></div>
  ${d.workouts.length?d.workouts.map(w=>`<div class="row" style="border-top:1px solid var(--line)"><div class="n"><b>${esc(w.name)}</b><small>${esc(w.type)} · ${r0(w.min)} min${w.detail?' · '+esc(w.detail):''}</small></div><div class="k">${fmt(w.kcal)} kcal</div><button class="x" data-del-wo="${esc(w.id)}" aria-label="Borrar entreno">×</button></div>`).join('')
  :`<div class="empty">Sin entrenos este día.</div>`}
  <details class="add"><summary>Añadir entreno</summary>
    <form class="form" id="f-wo">
      <label class="half">Deporte<select name="sport">${Object.entries(SPORTS).map(([k,v])=>`<option value="${k}" ${k===WO.sport?'selected':''}>${v.label}</option>`).join('')}</select></label>
      <label>Intensidad<select name="lvl">${['Suave','Normal','Intensa'].map((t,i)=>`<option value="${i}" ${i===WO.lvl?'selected':''}>${t}</option>`).join('')}</select></label>
      <label>Minutos<input name="min" type="number" inputmode="numeric" min="1" required value="${WO.min||''}"></label>
      <label class="km" ${SPORTS[WO.sport]?.km?'':'hidden'}>Km (opcional)<input name="km" type="number" inputmode="decimal" step="0.1" min="0" placeholder="ritmo exacto"></label>
      <label class="half">Detalle (opcional)<input name="detail" placeholder="Pierna: 4x8 sentadilla 80 kg"></label>
      <label>kcal de tu reloj<input name="kcal" type="number" inputmode="numeric" min="0" placeholder="opcional"></label>
      <p class="full woest" id="woest">${woEstText()}</p>
      <div class="full"><button class="btn">Añadir</button></div>
    </form></details>`;
}
// METs (Compendium of Physical Activities). Se cuenta (MET-1) porque el reposo ya está en tu gasto base.
const SPORTS={
  gym:{label:'Gimnasio (pesas)',type:'Fuerza',lv:[3.5,5,6]},
  running:{label:'Running',type:'Cardio',lv:[8.3,9.8,11.5],km:true},
  padel:{label:'Pádel',type:'Deporte',lv:[5,6,7.5]},
  futbol:{label:'Fútbol (entreno)',type:'Deporte',lv:[6,7,8]},
  partido:{label:'Fútbol (partido)',type:'Deporte',lv:[7,8.5,10]},
  bici:{label:'Bici / elíptica',type:'Cardio',lv:[5.5,7,9]},
  andar:{label:'Caminar',type:'Cardio',lv:[3,3.8,5],km:true},
  movilidad:{label:'Movilidad / estiramientos',type:'Movilidad',lv:[2.3,2.5,3]},
  otro:{label:'Otro',type:'Otro',lv:[3,4.5,6]}};
const WO={sport:'gym',lvl:1,min:''};
const sportKey=x=>{const t=String(x||'').toLowerCase();if(SPORTS[t])return t;
  if(/run|corr/.test(t))return'running';if(/p[aá]del/.test(t))return'padel';if(/partido/.test(t))return'partido';if(/f[uú]tbol|futbito|fut/.test(t))return'futbol';
  if(/gim|gym|pesas|fuerza|pierna|torso|pecho|espalda|brazo|hombro|push|pull/.test(t))return'gym';if(/bici|cicl|el[ií]ptica|spinning/.test(t))return'bici';
  if(/camin|andar|pase/.test(t))return'andar';if(/movil|estir|yoga/.test(t))return'movilidad';return'otro'};
function metFor(sp,lvl,min,km){const s=SPORTS[sp]||SPORTS.otro;
  if(s.km&&km>0&&min>0){const v=km*1000/min;return sp==='andar'&&v<134?Math.max(2,(3.5+0.1*v)/3.5):Math.min(18,(3.5+0.2*v)/3.5)}
  return s.lv[Math.max(0,Math.min(2,r0(lvl)))]}
function woKcal(sp,lvl,min,km){return r0(Math.max(0,metFor(sp,lvl,min,km)-1)*(curWeight()||75)*(+min||0)/60)}
function woEstText(){const f=document.getElementById('f-wo');let sp=WO.sport,lvl=WO.lvl,min=+WO.min||0,km=0;
  if(f){sp=f.sport.value;lvl=+f.lvl.value;min=+f.min.value||0;km=SPORTS[sp].km?+(f.km&&f.km.value)||0:0}
  const w=curWeight();if(!min)return`Pon los minutos y te calculo las kcal${w?` con tus ${fmt(w)} kg`:''}.`;
  const pace=SPORTS[sp].km&&km>0?` · ritmo ${Math.floor(min/km)}:${String(Math.round(min/km%1*60)).padStart(2,'0')} min/km`:'';
  return`≈ <b>${fmt(woKcal(sp,lvl,min,km))} kcal</b> quemadas${pace}${w?` · con tus ${fmt(w)} kg`:' · pon tu peso para afinar'}`}

const RC={busy:false,err:'',list:[],meal:null,t:{kcal:'',p:'',c:'',f:''},have:'',prev:[],tgt:null};
function remaining(){const t=totals(today()),T=targets(),p=S.profile||{};return{kcal:Math.max(0,r0(T.kcal+(p.addExercise?t.burn:0)-t.kcal)),p:Math.max(0,r0(T.p-t.p)),c:Math.max(0,r0(T.c-t.c)),f:Math.max(0,r0(T.f-t.f))}}
function recipeCard(){
  const L=remaining(),meal=RC.meal||mealNow(),tg=RC.tgt;
  const fields=[['kcal','kcal'],['p','Proteína (g)'],['c','Carbos (g)'],['f','Grasa (g)']];
  return `<div class="card sug" id="recipe">
    <h2>Recetas para tus macros</h2>
    <p class="rem">Hoy te quedan ${fmt(L.kcal)} kcal · P ${L.p} g · C ${L.c} g · G ${L.f} g. <button type="button" class="link" data-fillrem="1">Usar estos valores</button></p>
    <form class="rform" id="f-rec">
      <label>Para<select name="meal">${MEALS.map(([k,n])=>`<option value="${k}" ${k===meal?'selected':''}>${n}</option>`).join('')}</select></label>
      ${fields.map(([k,n])=>`<label>${n}<input name="${k}" type="number" inputmode="numeric" min="0" placeholder="0" value="${esc(RC.t[k])}"></label>`).join('')}
      <label class="have">¿Qué tienes en casa? (opcional)<input name="have" placeholder="pollo, arroz, pimiento…" value="${esc(RC.have)}"></label>
      <button class="btn hot" ${RC.busy?'disabled':''}>${RC.busy?'Creando recetas…':RC.list.length?'Otras 3 recetas':'Dame 3 recetas'}</button>
    </form>
    <p class="rd" style="margin:8px 0 0">Rellena los valores que quieras. Los vacíos no cuentan.</p>
    ${RC.err?`<p class="empty">${esc(RC.err)}</p>`:''}

      <h3>${esc(r.nombre)}</h3><p class="rd">${esc(r.descripcion)}${r.min?` · ${r.min} min`:''}</p>

/* Ajusta la cantidad de cada ingrediente (entre x0,5 y x1,8) para acercar la receta a los macros pedidos */
function fitMacros(ing,tg){
  const keys=['kcal','p','c','f'].filter(k=>tg[k]);if(!ing.length||!keys.length)return ing;
  const sc=ing.map(()=>1);
  const err=()=>keys.reduce((e,k)=>{const v=ing.reduce((s,a,i)=>s+a[k]*sc[i],0);return e+((v-tg[k])/tg[k])**2*(k==='kcal'?2:1)},0)+sc.reduce((e,x)=>e+0.02*(x-1)**2,0);
  for(let it=0;it<60;it++){let moved=false;
    for(let i=0;i<sc.length;i++){for(const d of[0.1,-0.1,0.03,-0.03]){const o=sc[i],n=Math.min(1.8,Math.max(0.5,o+d));if(n===o)continue;const e0=err();sc[i]=n;if(err()<e0-1e-9)moved=true;else sc[i]=o}}
    if(!moved)break}
  return ing.map((a,i)=>{const g=a.g>0?Math.max(5,Math.round(a.g*sc[i]/5)*5):0;const k=a.g>0?g/a.g:sc[i];return{...a,g:g||a.g,kcal:r0(a.kcal*k),p:r1(a.p*k),c:r1(a.c*k),f:r1(a.f*k)}});
}

let wObs=null;
function drawWeight(){
  const box=$('#wfig');if(!box)return;

function paintWeight(box){
  const W=box.clientWidth,H=box.clientHeight;if(!W)return;
  const ws=Object.keys(S.days).filter(k=>S.days[k].weight).sort().map(k=>({t:parse(k).getTime(),w:+S.days[k].weight,k}));
  if(ws.length<2){box.innerHTML=`<div class="none">Apunta tu peso en «Hoy» (en ayunas, mismo día de la semana).<br>Con 2 registros aparece la gráfica.</div>`;return}
  const gw=num(S.profile&&S.profile.goalWeight);
  const vals=ws.map(x=>x.w).concat(gw&&Math.abs(gw-ws[ws.length-1].w)<15?[gw]:[]);
  let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const L=44,Rm=70,Tp=18,B=30;
  const x=t=>L+(t-ws[0].t)/(ws[ws.length-1].t-ws[0].t||1)*(W-L-Rm);
  const y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  let g='';for(let v=Math.ceil(lo);v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-Rm+10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  if(vals.includes(gw))g+=`<line x1="${L}" x2="${W-Rm+10}" y1="${y(gw)}" y2="${y(gw)}" stroke="var(--ok)" stroke-dasharray="5 5" stroke-width="2"/><text x="${W-Rm+14}" y="${y(gw)+4}" style="fill:var(--ok)">obj. ${r1(gw)}</text>`;
  const pts=ws.map(p=>`${x(p.t).toFixed(1)},${y(p.w).toFixed(1)}`).join(' ');
  const lp=ws[ws.length-1];
  const fd=k=>parse(k).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><path d="M${x(ws[0].t)},${H-B} L${pts.replace(/ /g,' L')} L${x(lp.t)},${H-B}Z" fill="var(--hot)" opacity=".12"/>${g}
  <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="3" stroke-linejoin="round"/>
  ${ws.length<40?ws.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.w)}" r="3.5" fill="var(--hot)"/>`).join(''):''}
  <text x="${x(lp.t)+10}" y="${y(lp.w)+5}" style="fill:var(--ink);font-weight:800;font-size:15px">${r1(lp.w)} kg</text>
  <text x="${L}" y="${H-8}">${fd(ws[0].k)}</text><text x="${W-Rm}" y="${H-8}" text-anchor="end">${fd(lp.k)}</text></svg>`;
}

- Si dice «recuerda…» o cuenta algo estable y útil (alergias, gustos, horarios, raciones habituales), usa recordar. Si pide olvidar algo, usa olvidar. Si quiere guardar un alimento sin haberlo comido, usa guardar_alimento.
- Si cuenta algo que ha comido o bebido, llama a registrar_comida (un alimento por elemento). Si no da cantidades, usa raciones típicas en España y di qué supusiste. Usa valores nutricionales de referencia (BEDCA, USDA, etiquetas habituales). Elige el momento por la hora o por lo que diga.
- Si solo pregunta por un alimento o plato, responde con kcal y macros y NO lo apuntes.
- Entrenos: registrar_entreno con deporte, minutos e intensidad (normal si no lo dice); la app calcula las kcal con su peso. No inventes kcal: pasa kcal_reloj solo si él las da. Si falta la duración, pregúntala. Peso, cintura, agua, sueño o pasos: registrar_cuerpo.
- Para corregir o borrar, usa leer_dia para ver los ids y borrar_registro, y vuelve a apuntar si hace falta.
- Para preguntas sobre su evolución usa resumen_periodo.
- Tras apuntar, di en una o dos líneas qué apuntaste y cuántas kcal y gramos de proteína le quedan hoy.
- Al recomendar comidas, ajústalas a las kcal y proteína que le quedan, con cantidades en gramos.
- Si pide una receta, créala para que sume las kcal y la proteína que le quedan (o las que pida), con ingredientes en gramos, macros totales y pasos cortos. Si quiere, apúntala con registrar_comida como un solo plato.
- No eres médico. Ante dolor, mareos, lesiones, medicación o señales de trastorno alimentario, recomienda consultar a un profesional. No propongas dietas por debajo de ${T.floor} kcal ni perder más del 1 % del peso por semana.`;

function libText(){return (S.lib.items||[]).slice().sort((a,b)=>(b.uses||0)-(a.uses||0)).slice(0,60).map(x=>`- ${x.name} (${x.unit==='g'?'100 g':x.label}): ${r0(x.kcal)} kcal, P${r1(x.p)} C${r1(x.c)} G${r1(x.f)}`).join('\n')||'- (vacío)'}
function addMem(t){S.mem={notes:[...(S.mem.notes||[]),{id:uid(),text:t,date:today()}].slice(-60)};save('memory',S.mem);renderLib()}
function upsertLib(list){
  const items=(S.lib.items||[]).map(x=>({...x}));
  for(const it of list){const k=norm(it.name);if(!k)continue;const e=items.find(x=>norm(x.name)===k);const clean={name:it.name,unit:it.unit,base:it.base,def:it.def,label:it.label,kcal:it.kcal,p:it.p,c:it.c,f:it.f};
    if(e)Object.assign(e,clean,{uses:(e.uses||0)+1,last:today()});else items.push({...clean,id:uid(),uses:1,last:today()})}
  S.lib={items:items.slice(-300)};save('library',S.lib);renderLib();
}

const ERR={no_key:'Falta la clave gratuita de Gemini en Vercel (GEMINI_API_KEY). Mira el README.',bad_password:'Contraseña incorrecta. Escríbela en Perfil.',api_error:'Error del servidor de IA. Prueba en un momento.',busy:'Los servidores gratuitos de Google están saturados ahora mismo. Prueba en un minuto.',not_granted:'Necesito permiso para usar Claude. Ábrelo desde Claude y acepta el aviso.',rate_limited:'Has llegado al límite gratuito por ahora. Espera un rato y vuelve a probar.',session_expired:'Tu sesión ha caducado. Recarga la página.',sampling_disabled:'El asistente no está disponible en esta cuenta.',refused:'No puedo responder a eso.',prompt_too_large:'La conversación es muy larga. Borra el chat en Perfil.'};
async function send(text){
  text=text.trim();if(!text||busy)return;
  if(!sample){toast('El asistente solo está en la versión de Claude.');return}
  const hist=(S.chat.turns||[]).slice(-16);
  S.chat={turns:[...(S.chat.turns||[]),{role:'user',content:text}]};
  busy=true;renderChat();
  const input=[{role:'user',content:rules()},{role:'assistant',content:'Entendido. Te ayudo y apunto lo que me digas.'}];
  for(const t of hist){const l=input[input.length-1];if(l.role===t.role)l.content+='\n'+t.content;else input.push({role:t.role,content:t.content})}
  if(input[input.length-1].role==='user')input[input.length-1].content+='\n'+text;else input.push({role:'user',content:text});
  const acts=[];ctl=new AbortController();let out;
  try{
    const r=await sample(input,{cache:false,signal:ctl.signal,tools:tools(acts),onText:({text})=>{const el=$('#live');if(el)el.textContent=text;$('#msgs').scrollTop=1e9}});
    out={role:'assistant',content:r.text||'Hecho.',acts};
  }catch(e){
    const c=e&&e.code;out={role:'assistant',content:(e&&e.text?e.text+'\n':'')+(c==='cancelled'?'(Parado)':ERR[c]||'No he podido responder ('+(c||'error')+').'),acts,err:c!=='cancelled'};
  }
  busy=false;S.chat.turns.push(out);S.chat.turns=S.chat.turns.slice(-40);save('chat',S.chat);renderChat();
}

let WEB=false;
const CLAUDE_URL='https://claude.ai/artifact/VdDxb12ocRBh8y4k4aLBos';
const PASSKEY='healthy-life-pass';
const getPass=()=>{try{return localStorage.getItem(PASSKEY)||''}catch(e){return ''}};
const upType=v=>Array.isArray(v)?v.map(upType):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,k==='type'&&typeof x==='string'?x.toUpperCase():upType(x)])):v;
/* asistente gratis en la web: Gemini (plan gratuito) a través de /api/ai */
function geminiSample(){
  const call=async(body,signal)=>{
    let r;try{r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json','x-app-password':getPass()},body:JSON.stringify(body),signal})}
    catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'api_error'}}
    const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:j.code||'api_error',message:j.error||''};return j};
  async function run(input,opts,json){
    opts=opts||{};
    const contents=(typeof input==='string'?[{role:'user',content:input}]:input).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content)}]}));
    const tl=opts.tools||[];
    const tools=tl.map(t=>({name:t.name,description:t.description,...(t.inputSchema?{parameters:upType(t.inputSchema)}:{})}));
    for(let round=0;round<8;round++){
      if(opts.signal&&opts.signal.aborted)throw{code:'cancelled'};
      const j=await call({contents,tools,json},opts.signal);
      const parts=(j.content&&Array.isArray(j.content.parts))?j.content.parts:[];
      const calls=parts.filter(x=>x.functionCall);
      const text=parts.filter(x=>x.text&&!x.thought).map(x=>x.text).join('');
      if(!calls.length){if(j.finishReason==='SAFETY'&&!text)throw{code:'refused'};opts.onText&&opts.onText({text,delta:text});return{text,truncated:j.finishReason==='MAX_TOKENS'}}
      contents.push({role:'model',parts});
      const resp=[];
      for(const x of calls){const name=x.functionCall.name,t=tl.find(y=>y.name===name);let out;
        try{if(!t)throw new Error('Herramienta desconocida');out=await t.execute(x.functionCall.args||{},{signal:opts.signal})}catch(e){out='Error: '+(e&&e.message||e)}
        resp.push({functionResponse:{name,response:{result:out}}})}
      contents.push({role:'user',parts:resp});
    }
    throw{code:'api_error'};
  }
  const retry=async(fn,n)=>{for(let k=0;;k++){try{return await fn()}catch(e){const c=e&&e.code;if(k>=n||c==='cancelled'||c==='no_key'||c==='bad_password'||c==='rate_limited')throw e;await new Promise(r=>setTimeout(r,800*(k+1)))}}};
  const f=(i,o)=>retry(()=>run(i,o,false),1);
  f.json=(i,o)=>retry(async()=>{const{text}=await run(i,o,true);const t=text.replace(/```(?:json)?/g,'');const m=t.match(/\{[\s\S]*\}/);try{return JSON.parse(m?m[0]:t)}catch(e){throw{code:'bad_json'}}},2);
  return f;
}

  if(b.closest('#chips')){send(b.textContent)}
  if(b.dataset.fillrem){const L=remaining();RC.t={kcal:String(L.kcal),p:String(L.p),c:String(L.c),f:String(L.f)};rerenderRecipe()}
  if(b.dataset.recadd&&RC.list[+b.dataset.recadd]){const r=RC.list[+b.dataset.recadd];const it={id:uid(),meal:r.meal,name:r.nombre,qty:'1 ración (receta)',kcal:r0(r.kcal),p:r1(r.p),c:r1(r.c),f:r1(r.f)};const d=editDay(today());d.foods.push(it);saveDay(today());
    upsertLib([{name:r.nombre,unit:'ud',base:1,def:1,label:'1 ración (receta)',kcal:it.kcal,p:it.p,c:it.c,f:it.f}]);toast(`Apuntado: ${r.nombre}, ${fmt(r.kcal)} kcal`);RC.list=[];RC.t={kcal:'',p:'',c:'',f:''};if(S.date!==today())S.date=today();render()}
  if(b.dataset.sheet)openSheet(b.dataset.sheet);
  if(b.dataset.sheetPick)openSheet(mealNow(),b.dataset.sheetPick);
  if(b.dataset.shmeal){shMeal=b.dataset.shmeal;document.querySelectorAll('#shmeal button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}
  if(b.dataset.pick){shPick=shPick===b.dataset.pick?null:b.dataset.pick;renderSheet()}
  if(b.dataset.step){const i=$('#shamt'),it=findItem(shPick);if(i&&it){i.value=Math.max(0,r1((num(i.value)||0)+ +b.dataset.step*(it.unit==='g'?10:0.5)));updCalc()}}
  if(b.dataset.addpick){const it=findItem(b.dataset.addpick),a=num($('#shamt').value);if(it&&a>0)addFromItem(it,a);else toast('Pon una cantidad')}
  if(b.id==='shclose')closeSheet();
  if(b.dataset.delLib){if(b.dataset.sure){S.lib={items:(S.lib.items||[]).filter(x=>x.id!==b.dataset.delLib)};save('library',S.lib);renderLib()}else{b.dataset.sure='1';b.textContent='¿Borrar?';b.style.width='auto'}}
  if(b.dataset.delMem){S.mem={notes:(S.mem.notes||[]).filter(x=>x.id!==b.dataset.delMem)};save('memory',S.mem);renderLib()}
  if(b.id==='clearchat'&&!busy){if(b.dataset.sure){S.chat={turns:[]};save('chat',S.chat);renderChat();b.textContent='Conversación borrada';delete b.dataset.sure}else{b.dataset.sure='1';b.textContent='Pulsa otra vez para confirmar'}}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='shq'){shPick=null;renderSheet()}if(e.target.id==='shamt')updCalc();woUpd(e)});
document.addEventListener('change',woUpd);
function woUpd(e){const f=e.target.closest&&e.target.closest('#f-wo');if(!f)return;const km=f.querySelector('.km');if(km)km.hidden=!SPORTS[f.sport.value].km;const o=f.querySelector('#woest');if(o)o.innerHTML=woEstText()}
$('#prev').onclick=()=>{S.date=addDays(S.date,-1);render()};
$('#next').onclick=()=>{if(S.date<today()){S.date=addDays(S.date,1);render()}};
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='apppass'){try{localStorage.setItem(PASSKEY,el.value.trim())}catch(e){}toast('Contraseña guardada');return}
  if(el.dataset.body){const d=editDay(S.date);const n=num(el.value);d[el.dataset.body]=n==null?null:(el.dataset.body==='steps'?r0(n):r1(n));saveDay(S.date);renderProg();if(el.dataset.body==='weight')renderPerfil()}
  if(el.closest('#f-prof')){const fd=new FormData($('#f-prof'));const p={...(S.profile||{})};
    for(const k of['sex','activity','goal','notes'])p[k]=String(fd.get(k)||'').slice(0,300);
    for(const k of['age','height','weight','goalWeight','protPerKg','kcalOverride'])p[k]=num(fd.get(k));
    p.addExercise=fd.get('addExercise')==='on';S.profile=p;save('profile',p);renderHoy();
    const a=document.activeElement;a&&a.blur&&a.matches('select,[type=checkbox]')&&a.blur();renderPerfil()}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(deferHoy&&!$('#v-hoy').contains(document.activeElement)){deferHoy=false;renderHoy()}},0));
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='composer'){if(busy){ctl&&ctl.abort();return}const q=$('#q');const v=q.value;q.value='';q.style.height='';send(v);return}
  if(f.id==='f-new'){const fd=new FormData(f);const it={name:String(fd.get('name')).trim().slice(0,80),unit:'ud',base:1,def:1,label:String(fd.get('label')||'').trim().slice(0,40)||'1 ración',kcal:r0(fd.get('kcal')),p:r1(fd.get('p')),c:r1(fd.get('c')),f:r1(fd.get('f'))};
    if(!it.name)return;upsertLib([it]);const saved=(S.lib.items||[]).find(x=>norm(x.name)===norm(it.name));
    if(fd.get('now')==='on'&&saved)addFromItem({...saved,mine:true},1,true);else{toast('Guardado en Mis alimentos');renderSheet()}
    f.reset();$('#shnew').open=false;return}
  if(f.id==='f-rec'){document.activeElement&&document.activeElement.blur();makeRecipe(f);return}
  if(f.id==='f-mem'){const t=String(new FormData(f).get('t')||'').trim();if(t){document.activeElement&&document.activeElement.blur();addMem(t)}return}
  const fd=new FormData(f);const d=editDay(S.date);
  if(f.id==='f-food')d.foods.push({id:uid(),meal:fd.get('meal'),name:String(fd.get('name')).slice(0,80),qty:String(fd.get('qty')||'').slice(0,40),kcal:r0(fd.get('kcal')),p:r1(fd.get('p')),c:r1(fd.get('c')),f:r1(fd.get('f'))});
  if(f.id==='f-wo'){const sp=sportKey(fd.get('sport')),lvl=+fd.get('lvl')||0,min=r0(fd.get('min')),s=SPORTS[sp],km=s.km?num(fd.get('km'))||0:0;WO.sport=sp;WO.lvl=lvl;WO.min=min;
    const det=[String(fd.get('detail')||'').trim(),km?km+' km':'',['suave','normal','intensa'][lvl]].filter(Boolean).join(' · ');
    d.workouts.push({id:uid(),type:s.type,sport:sp,name:s.label,min,kcal:num(fd.get('kcal'))>0?r0(fd.get('kcal')):woKcal(sp,lvl,min,km),detail:det.slice(0,300)})}
  saveDay(S.date);document.activeElement&&document.activeElement.blur();deferHoy=false;renderHoy();renderProg();
});
$('#q').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>=700){e.preventDefault();$('#composer').requestSubmit()}});
addEventListener('resize',()=>{if(innerWidth>=1000&&document.body.dataset.view==='chat')go('hoy')});

async function boot(){
  go('hoy');render();
  if(!window.claude){WEB=true;S.mode='local';loadLocal();sample=geminiSample();render();return}
  let db=null,user=null;
  try{[db,user,sample]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')])}catch(e){}
  const id=user?await user.id():null;
  if(!db||!id){S.mode='local';loadLocal();render();return}
  col=db.collection('data/users/'+id);
  const timer=setTimeout(()=>{if(S.mode==='cargando'){S.mode='local';loadLocal();col=null;render();toast('No conecto con tu cuenta: guardo en este navegador.')}},10000);
  col.onSnapshot(snap=>{
    clearTimeout(timer);if(S.mode==='local'&&!col)return;
    S.mode='nube';const days={};let prof=null,chat=null,lib=null,mem=null;
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='profile')prof=v;else if(d.id==='chat')chat=v;else if(d.id==='library')lib=v;else if(d.id==='memory')mem=v;else if(d.id.startsWith('day_'))days[d.id.slice(4)]=v});
    S.days=days;S.profile=prof;S.lib=lib||{items:[]};S.mem=mem||{notes:[]};if(!busy)S.chat=chat?structuredClone(chat):{turns:[]};
    render();
  },e=>{toast('Error de datos ('+(e&&e.code||'')+')')});
}
boot();
}
</script>
